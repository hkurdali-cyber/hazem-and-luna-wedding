    requestAnimationFrame(function(){requestAnimationFrame(function(){ib.style.transition="transform 1.8s cubic-bezier(.65,0,.25,1)";ib.style.transform="translate("+(B.left-A.left).toFixed(2)+"px,"+(B.top-A.top).toFixed(2)+"px) scale("+(B.width/A.width).toFixed(4)+")"})});
    setTimeout(land,1950)},reduce?0:420)}
function lightUp(){if(lit)return;lit=true;document.documentElement.classList.add("is-lit");startMusic();var b=document.getElementById("light");
  var w=document.getElementById("cover-wrap");if(w)w.classList.add("lit");var lr=document.querySelector(".light-row");if(lr)lr.classList.add("done");

var cdTimer=null;
function tick(){var el=document.getElementById("cd-d");if(!el)return;var target=eventDate(D.date,D.time);if(!target)return;var ms=target-Date.now(),note=document.getElementById("cd-note");
  if(ms<=0){note.hidden=false;note.textContent=Date.now()-target<86400e3?"اليوم هو اليوم الموعود":"شكراً لمشاركتكم فرحتنا";ms=0}
  var m=Math.floor(ms/60000);el.textContent=ar(Math.floor(m/1440));document.getElementById("cd-h").textContent=ar(Math.floor(m%1440/60));document.getElementById("cd-m").textContent=ar(m%60);
  clearTimeout(cdTimer);cdTimer=setTimeout(tick,30000)}

function wireRSVP(){
  var name=document.getElementById("r-name");if(!name)return;
  var out=document.getElementById("r-out"),digits=(D.whatsapp||"").replace(/\D/g,"");
  function msg(yes){return ["تأكيد حضور · زفاف "+D.groom+" و "+D.bride+" · "+shortDate(D.date),"الاسم: "+name.value.trim(),yes?"سأحضر بكلّ سرور":"أعتذر عن الحضور"].join("\n")}
  var EP=(D.rsvpEndpoint||"").trim(),busy=false;
  [["r-yes",true],["r-no",false]].forEach(function(p){var a=document.getElementById(p[0]);
    a.addEventListener("click",function(e){
      if(EP){var nm=name.value.trim();if(!nm){e.preventDefault();out.textContent="اكتبوا اسمكم أولاً.";name.focus();return}if(busy){e.preventDefault();return}busy=true;out.textContent="جارٍ الإرسال…";
        var both=!!digits,wurl="";if(both){wurl="https://wa.me/"+digits+"?text="+encodeURIComponent(msg(p[1]));a.href=wurl}else{e.preventDefault()}
        fetch(EP,{method:"POST",mode:"no-cors",keepalive:true,headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({name:nm,answer:p[1]?"سأحضر":"أعتذر"})})
          .then(function(){out.textContent=(p[1]?"سُجّل تأكيد حضوركم ✓":"سُجّل اعتذاركم.")+(both?" وفُتح واتساب برسالتكم، فاضغطوا «إرسال» هناك أيضاً.":"");if(both){var l=document.createElement("a");l.className="wa-again";l.href=wurl;l.target="_blank";l.rel="noopener";l.textContent="إن لم يفتح واتساب، اضغطوا هنا";out.appendChild(document.createElement("br"));out.appendChild(l)}})
          .catch(function(){out.textContent=both?"تعذّر الحفظ الآن، لكن رسالة واتساب جاهزة: اضغطوا «إرسال» هناك.":"تعذّر الإرسال الآن. تحقّقوا من الاتصال وحاولوا مرة أخرى."})
          .then(function(){busy=false});return}if(!digits){e.preventDefault();out.textContent="يُفتح تأكيد الحضور قريباً.";return}
      if(!name.value.trim()){e.preventDefault();out.textContent="اكتبوا اسمكم أولاً.";name.focus();return}
      a.href="https://wa.me/"+digits+"?text="+encodeURIComponent(msg(p[1]));out.textContent="فُتح واتساب برسالتكم. اضغطوا «إرسال» هناك للتأكيد."})});
  document.getElementById("rsvp-form").addEventListener("submit",function(e){e.preventDefault()});
}

var artifactNS=null,assetsNS=null;
function openEditor(){
  if(document.getElementById("editor"))return;
  var e=document.createElement("aside");e.className="editor";e.id="editor";e.setAttribute("aria-label","تعديل الدعوة");
  var body='';
  FIELDS.forEach(function(g,gi){body+='<details class="ed-group"'+(gi<2?' open':'')+'><summary>'+esc(g[0])+'</summary><div class="ed-fields">';
    g[1].forEach(function(f){var k=f[0],lab=f[1],ty=f[2]||"text",hint=f[3],id="ed-"+k;
      if(ty==="bool"){body+='<div class="ef row"><input type="checkbox" id="'+id+'" data-k="'+k+'"'+(D[k]?' checked':'')+'><label for="'+id+'">'+esc(lab)+'</label></div>';return}
      if(ty==="timeline"){body+='<div class="ef"><label>'+esc(lab)+'</label><div class="tl-ed" id="tl-ed"></div><button type="button" class="small-btn" id="tl-add">أضف فقرة</button></div>';return}
      if(ty==="image"){body+='<div class="ef"><label for="'+id+'">'+esc(lab)+'</label><div class="img-prev" data-prev="'+k+'"></div>'+(assetsNS?'<input type="file" data-up="'+k+'" id="'+id+'" accept="image/png,image/svg+xml,image/webp"><span class="hint">PNG بخلفية شفافة أو SVG بالحبر الأسود.</span>':'<span class="hint">رفع الصور غير متاح هنا.</span>')+'</div>';return}
      if(ty==="range"){body+='<div class="ef"><label for="'+id+'">'+esc(lab)+'</label><input type="range" min="0" max="6" step="1" id="'+id+'" data-k="'+k+'" value="'+esc(D[k])+'">'+(hint?'<span class="hint">'+esc(hint)+'</span>':'')+'</div>';return}
      var inType=ty==="ltr"?"text":ty;
      body+='<div class="ef"><label for="'+id+'">'+esc(lab)+'</label>'+(ty==="textarea"?'<textarea id="'+id+'" data-k="'+k+'">'+esc(D[k])+'</textarea>':'<input type="'+inType+'" id="'+id+'" data-k="'+k+'" value="'+esc(D[k])+'"'+(/ltr|url|tel|date|time/.test(ty)?' class="ltr"':'')+'>')+(hint?'<span class="hint">'+esc(hint)+'</span>':'')+'</div>'});
    body+='</div></details>'});
  e.innerHTML='<div class="ed-head"><strong>تعديل الدعوة</strong><button type="button" id="ed-close">إغلاق</button></div><div class="ed-body">'+body+'</div><div class="ed-foot"><button type="button" class="solid" id="ed-pub">انشر التعديلات</button><div class="ed-status" id="ed-status" role="status">التعديلات تظهر هنا فوراً، ويراها الضيوف بعد النشر.</div></div>';
  document.body.appendChild(e);
  e.addEventListener("input",function(ev){var k=ev.target.getAttribute("data-k");if(!k)return;D[k]=ev.target.type==="checkbox"?ev.target.checked:ev.target.type==="range"?+ev.target.value:ev.target.value;changed()});
  e.addEventListener("change",function(ev){var k=ev.target.getAttribute("data-up");if(!k)return;var file=ev.target.files&&ev.target.files[0];if(!file)return;status("جارٍ رفع الصورة…");
    assetsNS.upload(file).then(function(r){D[k]=r.url;renderImgs();changed();status("أُضيفت الصورة. انشر ليراها الضيوف.")},function(err){status("تعذّر الرفع: "+((err&&err.message)||"جرّب ملف PNG أو SVG أصغر")+".")})});
  e.addEventListener("click",function(ev){var k=ev.target.getAttribute("data-rm-img");if(!k)return;D[k]="";renderImgs();changed()});
  document.getElementById("ed-close").addEventListener("click",function(){e.remove()});
  document.getElementById("ed-pub").addEventListener("click",publish);
  renderTL();renderImgs();
  document.getElementById("tl-add").addEventListener("click",function(){D.timeline.push({t:"",l:"",i:"candle"});renderTL();changed()});
}
function renderImgs(){document.querySelectorAll("[data-prev]").forEach(function(p){var k=p.getAttribute("data-prev"),u=imgUrl(D[k]);p.innerHTML=u?'<img src="'+esc(u)+'" alt=""><button type="button" class="small-btn" data-rm-img="'+k+'">إزالة</button>':'<span class="hint">لا توجد صورة؛ تظهر الأسماء مكتوبة.</span>'})}
function renderTL(){var box=document.getElementById("tl-ed");if(!box)return;
  box.innerHTML=D.timeline.map(function(r,i){return '<div class="tl-row"><input type="time" class="ltr" id="tl-t-'+i+'" value="'+esc(r.t)+'" aria-label="الوقت"><input type="text" id="tl-l-'+i+'" value="'+esc(r.l)+'" placeholder="الفقرة" aria-label="الفقرة"><select id="tl-i-'+i+'" aria-label="الرسم">'+Object.keys(ICON_NAMES).map(function(k){return '<option value="'+k+'"'+(r.i===k?' selected':'')+'>'+ICON_NAMES[k]+'</option>'}).join("")+'</select><button type="button" data-rm="'+i+'" aria-label="حذف">×</button></div>'}).join("");
  box.oninput=box.onchange=function(ev){var m=/^tl-(t|l|i)-(\d+)$/.exec(ev.target.id);if(!m)return;D.timeline[+m[2]][m[1]]=ev.target.value;changed()};
  box.onclick=function(ev){var i=ev.target.getAttribute("data-rm");if(i==null)return;D.timeline.splice(+i,1);renderTL();changed()}}
function status(t){var s=document.getElementById("ed-status");if(s)s.textContent=t}
function changed(){var y=scrollY;render();scrollTo(0,y);status("تعديلات غير منشورة. يراها الضيوف بعد النشر.")}

var RESET=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
var FONTS='https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&family=Tajawal:wght@200;300;400;500;700&display=swap';
function buildDoc(){
  var css=document.getElementById("inv-css").textContent,js=document.getElementById("inv-js").textContent,json=JSON.stringify(D).replace(/</g,"\\u003c");
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
    '<title>'+esc(D.groom+" و "+D.bride)+'</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="stylesheet" href="'+FONTS.replace(/&/g,"&amp;")+'">\n<style id="inv-css">'+css+'</style>\n\n<div class="page" id="app"></div>\n\n<script type="application/json" id="inv-data">'+json+'<\/script>\n\n<script id="inv-js">'+js+'<\/script>\n</body></html>';
}
function publish(){
  var b=document.getElementById("ed-pub");if(!artifactNS){status("النشر غير متاح هنا.");return}
  b.disabled=true;status("جارٍ النشر…");
  artifactNS.publish(buildDoc()).then(function(){status("تمّ النشر. ستُعاد الصفحة بالتعديلات.")},function(err){b.disabled=false;var c=err&&err.code;
    status(c==="conflict"?"نُشرت نسخة أحدث. الصفحة تُعاد الآن، أعد التعديل بعدها.":(c==="not_writer"||c==="not_granted")?"ليست لديك صلاحية نشر هذه الدعوة.":"تعذّر النشر ("+(c||"خطأ")+"). حاول بعد قليل.")});
}
function initEditor(){
  if(!window.claude||!claude.use)return;
  Promise.all([claude.use("user"),claude.use("artifact"),claude.use("assets")]).then(function(r){
    var user=r[0];artifactNS=r[1];assetsNS=r[2];if(!artifactNS||!user)return;
    return user.canEdit().then(function(ok){if(!ok)return;var b=document.createElement("button");b.className="edit-fab";b.type="button";b.textContent="تعديل الدعوة";b.addEventListener("click",openEditor);document.body.appendChild(b)});
  }).catch(function(){});
}
render();initEditor();
})();
